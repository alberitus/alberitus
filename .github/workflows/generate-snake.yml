name: auto run

on:
  schedule:
    - cron: "0 0 * * *" # jalan tiap jam 00:00 UTC = jam 7 pagi WIB
  workflow_dispatch: # tetap bisa manual kalau mau

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # SVG-only mode (fast build)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alberitus
          outputs: |
            dist/only-svg/github-contribution-grid-snake.svg
            dist/only-svg/github-contribution-grid-snake-dark.svg
          palette: github-dark

      # Full render with gif (slower build)
      - uses: Platane/snk@v3
        with:
          github_user_name: alberitus
          outputs: |
            dist/docker/github-contribution-grid-snake.svg
            dist/docker/github-contribution-grid-snake-dark.svg
            dist/docker/github-contribution-grid-snake.gif
          palette: github-dark
          color_snake: orange
          color_dots: "#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9"

      - name: ensure the generated files exist
        run: |
          ls dist/only-svg
          test -f dist/only-svg/github-contribution-grid-snake.svg
          test -f dist/only-svg/github-contribution-grid-snake-dark.svg

          ls dist/docker
          test -f dist/docker/github-contribution-grid-snake.svg
          test -f dist/docker/github-contribution-grid-snake-dark.svg
          test -f dist/docker/github-contribution-grid-snake.gif

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
