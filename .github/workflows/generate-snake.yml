name: Auto Update GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # jalan tiap jam 00:00 UTC = jam 7 pagi WIB
  workflow_dispatch: # bisa manual run juga

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # SVG-only mode (cepat)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alberitus
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
          palette: github-dark

      # Full render dengan GIF
      - uses: Platane/snk@v3
        with:
          github_user_name: alberitus
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake.gif
          palette: github-dark
          color_snake: orange
          color_dots: "#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9"

      # Pastikan file hasil build ada
      - name: Ensure the generated files exist
        run: |
          ls dist
          test -f dist/github-contribution-grid-snake.svg
          test -f dist/github-contribution-grid-snake-dark.svg
          test -f dist/github-contribution-grid-snake.gif

      # Push hasil ke branch output (root folder)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
